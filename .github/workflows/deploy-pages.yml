name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Check out docs
        uses: actions/checkout@v4
        with:
          path: docs

      # Mint a short-lived token from the Visuno GitHub App so CI can read the
      # private components repo. Requires two secrets on this repo (or the org):
      #   VISUNO_DOCS_APP_ID          - the App's numeric ID
      #   VISUNO_DOCS_APP_PRIVATE_KEY - the App's PEM private key
      - name: Get components access token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VISUNO_DOCS_APP_ID }}
          private-key: ${{ secrets.VISUNO_DOCS_APP_PRIVATE_KEY }}
          owner: Visuno
          repositories: components

      # The prebuild script expects ../components/react next to the docs repo.
      - name: Check out reference components
        uses: actions/checkout@v4
        with:
          repository: Visuno/components
          ref: main
          path: components
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
